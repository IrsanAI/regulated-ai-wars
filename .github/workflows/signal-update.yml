name: Signal update (LLM)

on:
  schedule:
    # Monday 06:00 UTC — scout public RSS, then LLM draft if hits (or signal issues)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      signals:
        description: "Extra public signals (merged with scout + signal issues)"
        required: false
        type: string
        default: ""
      model:
        description: "Model id (Groq default: openai/gpt-oss-120b)"
        required: false
        type: string
        default: "openai/gpt-oss-120b"
      provider:
        description: "LLM provider"
        required: false
        type: choice
        options:
          - groq
          - xai
        default: groq
      open_pr:
        description: "Open a draft PR with the proposed snapshot"
        required: false
        type: boolean
        default: true
      skip_scout:
        description: "Skip RSS scout (use only pasted signals / issues)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSS signal scout
        id: scout
        env:
          SKIP_SCOUT: ${{ github.event.inputs.skip_scout || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p pipeline/out
          if [ "$SKIP_SCOUT" = "true" ]; then
            echo "Scout skipped by input."
            echo "(scout skipped)" > pipeline/out/scout.md
            echo '{"hitCount":0,"items":[],"note":"skipped"}' > pipeline/out/scout.json
            echo "hit_count=0" >> "$GITHUB_OUTPUT"
            echo "has_hits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python pipeline/scout_signals.py > pipeline/out/scout.stdout.md
          # Prefer scout.md written by script
          if [ -f pipeline/out/scout.md ]; then
            cp pipeline/out/scout.md pipeline/out/scout.stdout.md
          fi
          HITS=$(python -c "import json; print(json.load(open('pipeline/out/scout.json')).get('hitCount',0))")
          echo "hit_count=$HITS" >> "$GITHUB_OUTPUT"
          if [ "$HITS" -gt 0 ]; then
            echo "has_hits=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_hits=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Scout hits: $HITS"

      - name: Collect signals (scout + dispatch + issues labeled signal)
        id: signals
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SIGNALS: ${{ github.event.inputs.signals || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SIG=""

          if [ -f pipeline/out/scout.md ]; then
            SCOUT_BODY=$(cat pipeline/out/scout.md)
            if ! echo "$SCOUT_BODY" | grep -q 'no recent public headlines'; then
              SIG="${SCOUT_BODY}"
              echo "Using scout headlines."
            else
              echo "Scout reported no headlines."
            fi
          fi

          if [ -n "$INPUT_SIGNALS" ]; then
            if [ -n "$SIG" ]; then
              SIG="${SIG}\n\n---\n## Manual signals (workflow_dispatch)\n\n${INPUT_SIGNALS}"
            else
              SIG="## Manual signals (workflow_dispatch)\n\n${INPUT_SIGNALS}"
            fi
          fi

          ISSUE_BLOB=""
          if command -v gh >/dev/null 2>&1; then
            ISSUE_BLOB=$(gh issue list \
              --repo "${{ github.repository }}" \
              --label signal \
              --state open \
              --limit 10 \
              --json number,title,body \
              --jq '[.[] | "### Issue #\(.number): \(.title)\n\(.body // "")"] | join("\n\n---\n\n")' \
              2>/dev/null || true)
          fi

          if [ -n "$ISSUE_BLOB" ]; then
            if [ -n "$SIG" ]; then
              SIG="${SIG}\n\n---\n## Open issues (label: signal)\n\n${ISSUE_BLOB}"
            else
              SIG="## Open issues (label: signal)\n\n${ISSUE_BLOB}"
            fi
            echo "Found open signal issues."
          fi

          {
            echo "text<<RAW_SIGNALS"
            echo "$SIG"
            echo "RAW_SIGNALS"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$SIG" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "Schedule: no scout hits, no issues, no manual text — skip API."
              echo "skip_all=true" >> "$GITHUB_OUTPUT"
            else
              echo "Manual run with empty combined signals — pipeline may keep board stable."
              echo "skip_all=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve secrets
        if: steps.signals.outputs.skip_all != 'true'
        id: secrets
        env:
          PROVIDER: ${{ github.event.inputs.provider || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          P="$PROVIDER"
          echo "provider=$P" >> "$GITHUB_OUTPUT"
          if [ "$P" = "groq" ]; then
            if [ -z "$GROQ_API_KEY" ]; then
              echo "GROQ_API_KEY secret is not set."
              exit 1
            fi
          elif [ "$P" = "xai" ]; then
            if [ -z "$XAI_API_KEY" ]; then
              echo "XAI_API_KEY secret is not set."
              exit 1
            fi
          else
            echo "Unknown provider: $P"
            exit 1
          fi

      - name: Run signal → draft pipeline
        if: steps.signals.outputs.skip_all != 'true'
        env:
          LLM_PROVIDER: ${{ github.event.inputs.provider || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ github.event.inputs.model || 'openai/gpt-oss-120b' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ github.event.inputs.model || 'grok-4-latest' }}
          SIGNAL_TEXT: ${{ steps.signals.outputs.text }}
        run: |
          python pipeline/run_signal_update.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-draft
          path: pipeline/out/
          if-no-files-found: ignore

      - name: PR gate
        if: steps.signals.outputs.skip_all != 'true'
        id: gate
        run: |
          OPEN="${{ github.event.inputs.open_pr }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$OPEN" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push draft branch + try PR
        if: steps.signals.outputs.skip_all != 'true' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(python -c "import json; print(json.load(open('pipeline/out/draft-snapshot.json'))['meta']['snapshotDate'])")
          BRANCH="signal-draft/${DATE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          cp pipeline/out/draft-snapshot.json "data/history/${DATE}.json"
          cp pipeline/out/draft-snapshot.json data/snapshot.json

          python - <<'PY'
          import json
          from pathlib import Path
          draft = json.loads(Path("pipeline/out/draft-snapshot.json").read_text())
          date = draft["meta"]["snapshotDate"]
          note = draft["meta"].get("note", "Automated signal draft")
          idx_path = Path("data/history/index.json")
          idx = json.loads(idx_path.read_text())
          entry = {
              "id": date,
              "date": date,
              "label": f"Signal draft — {date}",
              "file": f"{date}.json",
              "note": note[:240],
          }
          idx["snapshots"] = [s for s in idx.get("snapshots", []) if s.get("id") != date]
          idx["snapshots"].append(entry)
          idx["snapshots"].sort(key=lambda s: s["date"])
          idx["current"] = date
          idx_path.write_text(json.dumps(idx, indent=2) + "\n")
          PY

          mkdir -p pipeline/out
          git add data/snapshot.json "data/history/${DATE}.json" data/history/index.json
          git add -f pipeline/out/rationale.md pipeline/out/validation.json pipeline/out/scout.json pipeline/out/scout.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): signal draft snapshot ${DATE}"
          git push -u origin "$BRANCH"

          BODY_FILE=$(mktemp)
          {
            echo "## Automated signal draft"
            echo
            echo "Sources may include:"
            echo "- **RSS scout** (Google News queries for regulated verticals)"
            echo "- Open issues labeled \`signal\`"
            echo "- Manual workflow_dispatch text"
            echo
            echo "**Review before merge** — scores remain relative estimates."
            echo
            if [ -f pipeline/out/scout.json ]; then
              echo "### Scout"
              echo '```json'
              python -c "import json; d=json.load(open('pipeline/out/scout.json')); print(json.dumps({k:d.get(k) for k in ('scoutedAt','hitCount','queryCount')}, indent=2))"
              echo '```'
              echo
            fi
            echo "### Validation"
            echo '```json'
            cat pipeline/out/validation.json
            echo '```'
            echo
            echo "### Rationale"
            cat pipeline/out/rationale.md
            echo
            echo "---"
            echo "Methodology: \`data/SOURCES.md\` · Scout: \`pipeline/scout_signals.py\`"
          } > "$BODY_FILE"

          if gh pr create \
            --draft \
            --title "Signal draft: board ${DATE}" \
            --body-file "$BODY_FILE" \
            --base main \
            --head "$BRANCH"; then
            echo "Draft PR created."
          else
            echo "::warning::Could not auto-create PR."
            echo "Open: https://github.com/${{ github.repository }}/compare/main...${BRANCH}?expand=1"
            exit 0
          fi
