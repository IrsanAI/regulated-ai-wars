name: Signal update (LLM)

on:
  schedule:
    # Monday 06:00 UTC — runs API only if open issues labeled `signal` exist
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      signals:
        description: "Public signals (product launches, analyst notes, announcements)"
        required: false
        type: string
        default: ""
      model:
        description: "Model id (Groq default: openai/gpt-oss-120b)"
        required: false
        type: string
        default: "openai/gpt-oss-120b"
      provider:
        description: "LLM provider"
        required: false
        type: choice
        options:
          - groq
          - xai
        default: groq
      open_pr:
        description: "Open a draft PR with the proposed snapshot"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect signals (dispatch input + open issues labeled signal)
        id: signals
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SIGNALS: ${{ github.event.inputs.signals || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SIG="$INPUT_SIGNALS"

          # Open issues with label `signal` (public, citable text in title/body)
          ISSUE_BLOB=""
          if command -v gh >/dev/null 2>&1; then
            ISSUE_BLOB=$(gh issue list \
              --repo "${{ github.repository }}" \
              --label signal \
              --state open \
              --limit 10 \
              --json number,title,body \
              --jq '[.[] | "### Issue #\(.number): \(.title)\n\(.body // "")"] | join("\n\n---\n\n")' \
              2>/dev/null || true)
          fi

          if [ -n "$ISSUE_BLOB" ]; then
            if [ -n "$SIG" ]; then
              SIG="${SIG}\n\n---\nSignals from open issues (label: signal):\n\n${ISSUE_BLOB}"
            else
              SIG="Signals from open issues (label: signal):\n\n${ISSUE_BLOB}"
            fi
            echo "Found open signal issues."
          else
            echo "No open issues with label signal."
          fi

          # Persist for the pipeline step
          {
            echo "text<<RAW_SIGNALS"
            echo "$SIG"
            echo "RAW_SIGNALS"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$SIG" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "Scheduled run with no signals and no signal-issues — skip API (save quota)."
              echo "skip_all=true" >> "$GITHUB_OUTPUT"
            else
              echo "Manual run with empty signals — pipeline may keep board stable."
              echo "skip_all=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve secrets
        if: steps.signals.outputs.skip_all != 'true'
        id: secrets
        env:
          PROVIDER: ${{ github.event.inputs.provider || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          P="$PROVIDER"
          echo "provider=$P" >> "$GITHUB_OUTPUT"
          if [ "$P" = "groq" ]; then
            if [ -z "$GROQ_API_KEY" ]; then
              echo "GROQ_API_KEY secret is not set."
              echo "Create a free key at https://console.groq.com/keys"
              echo "Then add Repository secret GROQ_API_KEY (gsk_...)."
              exit 1
            fi
          elif [ "$P" = "xai" ]; then
            if [ -z "$XAI_API_KEY" ]; then
              echo "XAI_API_KEY secret is not set (and xAI requires paid credits)."
              exit 1
            fi
          else
            echo "Unknown provider: $P"
            exit 1
          fi

      - name: Run signal → draft pipeline
        if: steps.signals.outputs.skip_all != 'true'
        env:
          LLM_PROVIDER: ${{ github.event.inputs.provider || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ github.event.inputs.model || 'openai/gpt-oss-120b' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ github.event.inputs.model || 'grok-4-latest' }}
          SIGNAL_TEXT: ${{ steps.signals.outputs.text }}
        run: |
          python pipeline/run_signal_update.py

      - name: Upload artifacts
        if: steps.signals.outputs.skip_all != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signal-draft
          path: pipeline/out/

      - name: PR gate
        if: steps.signals.outputs.skip_all != 'true'
        id: gate
        run: |
          OPEN="${{ github.event.inputs.open_pr }}"
          # schedule always opens draft PR when signals existed
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$OPEN" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push draft branch + try PR
        if: steps.signals.outputs.skip_all != 'true' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(python -c "import json; print(json.load(open('pipeline/out/draft-snapshot.json'))['meta']['snapshotDate'])")
          BRANCH="signal-draft/${DATE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          cp pipeline/out/draft-snapshot.json "data/history/${DATE}.json"
          cp pipeline/out/draft-snapshot.json data/snapshot.json

          python - <<'PY'
          import json
          from pathlib import Path
          draft = json.loads(Path("pipeline/out/draft-snapshot.json").read_text())
          date = draft["meta"]["snapshotDate"]
          note = draft["meta"].get("note", "Automated signal draft")
          idx_path = Path("data/history/index.json")
          idx = json.loads(idx_path.read_text())
          entry = {
              "id": date,
              "date": date,
              "label": f"Signal draft — {date}",
              "file": f"{date}.json",
              "note": note[:240],
          }
          idx["snapshots"] = [s for s in idx.get("snapshots", []) if s.get("id") != date]
          idx["snapshots"].append(entry)
          idx["snapshots"].sort(key=lambda s: s["date"])
          idx["current"] = date
          idx_path.write_text(json.dumps(idx, indent=2) + "\n")
          PY

          mkdir -p pipeline/out
          git add data/snapshot.json "data/history/${DATE}.json" data/history/index.json
          git add -f pipeline/out/rationale.md pipeline/out/validation.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): signal draft snapshot ${DATE}"
          git push -u origin "$BRANCH"

          echo "Branch pushed: $BRANCH"
          echo "Manual PR link: https://github.com/${{ github.repository }}/compare/main...${BRANCH}?expand=1"

          BODY_FILE=$(mktemp)
          {
            echo "## Automated signal draft"
            echo
            echo "Generated by \`pipeline/run_signal_update.py\` (Groq/xAI OpenAI-compatible API)."
            echo "**Review before merge** — scores remain relative estimates."
            echo
            echo "Signals may include open GitHub issues labeled \`signal\`."
            echo
            echo "### Validation"
            echo '```json'
            cat pipeline/out/validation.json
            echo '```'
            echo
            echo "### Rationale"
            cat pipeline/out/rationale.md
            echo
            echo "---"
            echo "Sources methodology: \`data/SOURCES.md\`"
          } > "$BODY_FILE"

          if gh pr create \
            --draft \
            --title "Signal draft: board ${DATE}" \
            --body-file "$BODY_FILE" \
            --base main \
            --head "$BRANCH"; then
            echo "Draft PR created."
          else
            echo "::warning::Could not auto-create PR (often: Actions not allowed to create PRs)."
            echo "Enable: Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests"
            echo "Or open manually: https://github.com/${{ github.repository }}/compare/main...${BRANCH}?expand=1"
            exit 0
          fi
