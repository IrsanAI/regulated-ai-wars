name: Signal update (xAI)

on:
  schedule:
    # Placeholder cadence — scheduled runs without signals exit early (no API spend).
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      signals:
        description: "Public signals (product launches, analyst notes, announcements)"
        required: false
        type: string
        default: ""
      model:
        description: "xAI model id"
        required: false
        type: string
        default: "grok-4-latest"
      open_pr:
        description: "Open a draft PR with the proposed snapshot"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Early exit on empty schedule
        id: early
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run without interactive signals — no API call. Use workflow_dispatch and paste signals."
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require API key
        if: steps.early.outputs.skip_all != 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "XAI_API_KEY secret is not set."
            exit 1
          fi

      - name: Run signal → draft pipeline
        if: steps.early.outputs.skip_all != 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ github.event.inputs.model || 'grok-4-latest' }}
          SIGNAL_TEXT: ${{ github.event.inputs.signals || '' }}
        run: |
          python pipeline/run_signal_update.py

      - name: Upload artifacts
        if: steps.early.outputs.skip_all != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signal-draft
          path: pipeline/out/

      - name: PR gate
        if: steps.early.outputs.skip_all != 'true'
        id: gate
        run: |
          OPEN="${{ github.event.inputs.open_pr }}"
          if [ "$OPEN" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft PR
        if: steps.early.outputs.skip_all != 'true' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(python -c "import json; print(json.load(open('pipeline/out/draft-snapshot.json'))['meta']['snapshotDate'])")
          BRANCH="signal-draft/${DATE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          cp pipeline/out/draft-snapshot.json "data/history/${DATE}.json"
          cp pipeline/out/draft-snapshot.json data/snapshot.json

          python - <<'PY'
          import json
          from pathlib import Path
          draft = json.loads(Path("pipeline/out/draft-snapshot.json").read_text())
          date = draft["meta"]["snapshotDate"]
          note = draft["meta"].get("note", "Automated signal draft")
          idx_path = Path("data/history/index.json")
          idx = json.loads(idx_path.read_text())
          entry = {
              "id": date,
              "date": date,
              "label": f"Signal draft — {date}",
              "file": f"{date}.json",
              "note": note[:240],
          }
          idx["snapshots"] = [s for s in idx.get("snapshots", []) if s.get("id") != date]
          idx["snapshots"].append(entry)
          idx["snapshots"].sort(key=lambda s: s["date"])
          idx["current"] = date
          idx_path.write_text(json.dumps(idx, indent=2) + "\n")
          PY

          mkdir -p pipeline/out
          git add data/snapshot.json "data/history/${DATE}.json" data/history/index.json
          # rationale may help reviewers — force-add even if out/ is gitignored
          git add -f pipeline/out/rationale.md pipeline/out/validation.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): signal draft snapshot ${DATE}"
          git push -u origin "$BRANCH"

          BODY_FILE=$(mktemp)
          {
            echo "## Automated signal draft"
            echo
            echo "Generated by \`pipeline/run_signal_update.py\` via xAI."
            echo "**Review before merge** — scores remain relative estimates."
            echo
            echo "### Validation"
            echo '```json'
            cat pipeline/out/validation.json
            echo '```'
            echo
            echo "### Rationale"
            cat pipeline/out/rationale.md
            echo
            echo "---"
            echo "Sources methodology: \`data/SOURCES.md\`"
          } > "$BODY_FILE"

          gh pr create \
            --draft \
            --title "Signal draft: board ${DATE}" \
            --body-file "$BODY_FILE" \
            --base main \
            --head "$BRANCH"
