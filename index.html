<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>regulated-ai-wars — Strategic Conquest Map</title>
<style>
:root{--bg:#070b14;--panel:#0f1524;--panel-2:#141c2e;--border:#1e2a40;--text:#eef2ff;--muted:#8b9bb8;--accent:#60a5fa;--google:#4285F4;--microsoft:#F25022;--anthropic:#C15F3C;--openai:#10A37F;--aws:#FF9900;--specialist:#A855F7;--ibm:#0F62FE}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#intro{position:fixed;inset:0;z-index:1000;background:#030712;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .stamp{font-size:.7rem;letter-spacing:.35em;color:#ef4444;border:1px solid #ef4444;padding:4px 12px;margin-bottom:20px;opacity:0;animation:fadeIn .6s .2s forwards}
#intro h1{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:700;text-align:center;opacity:0;animation:fadeIn .7s .5s forwards}
#intro p{margin-top:12px;color:var(--muted);font-size:.95rem;opacity:0;animation:fadeIn .7s .9s forwards}
#intro .enter{margin-top:28px;padding:10px 22px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;cursor:pointer;font-size:.85rem;opacity:0;animation:fadeIn .6s 1.3s forwards;transition:.2s}
#intro .enter:hover{background:var(--accent);color:#0b1220}
@keyframes fadeIn{to{opacity:1}}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:linear-gradient(90deg,#0a1020,#111827);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
header h1{font-size:1.2rem;font-weight:700}header h1 span{color:var(--accent)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,.view-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.82rem;transition:.2s}
button:hover,.view-btn:hover{border-color:var(--accent);background:#1a2438}
button.primary,.view-btn.active{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:transparent;color:#fff}
.timestamp{font-size:.75rem;color:var(--muted)}
.main{display:grid;grid-template-columns:250px 1fr 270px;gap:12px;padding:12px;height:calc(100vh - 58px)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;overflow-y:auto}
.panel h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.player{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:5px;border-radius:8px;background:rgba(255,255,255,.02);border-left:3px solid transparent}
.player:hover{background:rgba(255,255,255,.05)}
.player .token{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.68rem;color:#fff;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.player .name{font-weight:600;font-size:.84rem}.player .role{font-size:.68rem;color:var(--muted)}
.momentum{font-size:.62rem;padding:2px 5px;border-radius:4px;background:rgba(16,185,129,.15);color:#34d399;margin-left:auto}
.momentum.down{background:rgba(239,68,68,.15);color:#f87171}.momentum.stable{background:rgba(148,163,184,.12);color:#94a3b8}
.board-container{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;overflow:hidden}
.board-title{text-align:center;font-size:.95rem;font-weight:600;margin-bottom:10px;color:var(--muted)}
.board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:9px;min-height:0}
.territory{background:linear-gradient(160deg,#141c2e,#0c1220);border:1.5px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;position:relative;transition:all .25s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.territory:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.territory.hot{border-color:#ef4444}.territory.contested{border-color:#f59e0b}
.territory .name{font-weight:700;font-size:.88rem;margin-bottom:2px}.territory .meta{font-size:.62rem;color:var(--muted);margin-bottom:6px}
.influence-bar{height:5px;background:#0c1220;border-radius:3px;overflow:hidden;margin-bottom:6px;display:flex}.influence-bar span{height:100%;transition:width .4s}
.tokens{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.token-mini{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:700;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.status-badge{position:absolute;top:6px;right:6px;font-size:.58rem;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.5)}
.world-view{display:none;flex:1;flex-direction:column;min-height:0}.world-view.active{display:flex}.board.hidden{display:none}
.world-svg-wrap{flex:1;background:radial-gradient(ellipse at 50% 45%,#121a2e 0%,#060a14 70%);border-radius:10px;border:1px solid var(--border);overflow:hidden}
.world-svg-wrap svg{width:100%;height:100%;display:block}
.continent{stroke:#1a2538;stroke-width:1.5;transition:all .35s;cursor:pointer}.continent:hover{stroke:#fff;stroke-width:2.2;filter:brightness(1.18)}
.continent-label{font-size:11px;font-weight:600;fill:rgba(255,255,255,.8);pointer-events:none;text-anchor:middle}
.world-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:8px 0 0;font-size:.72rem}
.world-legend span{display:flex;align-items:center;gap:4px}.world-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:.78rem}.legend-swatch{width:13px;height:13px;border-radius:3px}
.event-log{margin-top:10px;max-height:220px;overflow-y:auto}.event{font-size:.73rem;padding:7px;border-left:3px solid var(--accent);background:rgba(96,165,250,.06);margin-bottom:5px;border-radius:0 6px 6px 0}.event .time{color:var(--muted);font-size:.62rem}
.pipeline{display:flex;flex-wrap:wrap;gap:5px}.pipeline-item{font-size:.68rem;padding:3px 7px;background:rgba(255,255,255,.04);border-radius:5px;border:1px solid var(--border)}
.metrics-box{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(168,85,247,.06));border:1px solid rgba(96,165,250,.22);border-radius:9px;padding:10px;margin-bottom:12px;font-size:.78rem}.metrics-box strong{color:var(--accent)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}.modal.open{display:flex}
.modal-content{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
.classified-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;display:inline-block;margin-left:6px;opacity:.5;cursor:pointer;transition:.2s}.classified-dot:hover{opacity:1;box-shadow:0 0 8px #ef4444}
@media(max-width:1100px){.main{grid-template-columns:1fr;height:auto}.board{grid-template-columns:repeat(2,1fr);min-height:400px}}
</style>
</head>
<body>
<div id="intro">
  <div class="stamp">CLASSIFIED // REGULATED VERTICALS</div>
  <h1>regulated-ai-wars</h1>
  <p>The high ground is under contest.</p>
  <button class="enter" onclick="enterWarRoom()">ENTER WAR ROOM</button>
</div>
<header>
  <h1>regulated-ai-wars <span>— Strategic Conquest Map</span><span class="classified-dot" title="Classified layer" onclick="triggerSurprise()"></span></h1>
  <div class="controls">
    <button class="view-btn active" id="btnBoard" onclick="switchView('board')">Risk Board</button>
    <button class="view-btn" id="btnWorld" onclick="switchView('world')">World Map</button>
    <span class="timestamp" id="lastUpdate">Snapshot: 2026-08-25</span>
    <button onclick="simulateUpdate()">↻ Update</button>
    <button class="primary" onclick="resetBoard()">Reset</button>
  </div>
</header>
<div class="main">
  <div class="panel">
    <h2>Big Players & Contenders</h2>
    <div id="playersList"></div>
    <div style="margin-top:14px"><h2>Off-Board / Pipeline</h2><div class="pipeline" id="pipeline"></div></div>
  </div>
  <div class="board-container">
    <div class="board-title" id="viewTitle">THE BOARD — Regulated AI Verticals</div>
    <div class="board" id="board"></div>
    <div class="world-view" id="worldView">
      <div class="world-svg-wrap">
        <svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
          <path class="continent" id="na" d="M80,80 L220,60 L280,90 L300,160 L260,220 L180,240 L120,200 L70,150 Z"/>
          <path class="continent" id="sa" d="M200,260 L270,250 L290,320 L260,400 L200,420 L170,360 L180,290 Z"/>
          <path class="continent" id="eu" d="M420,70 L520,60 L540,100 L510,150 L450,160 L410,120 Z"/>
          <path class="continent" id="af" d="M430,170 L530,160 L560,240 L540,340 L470,360 L420,300 L410,220 Z"/>
          <path class="continent" id="as" d="M540,50 L780,40 L850,100 L820,180 L700,200 L580,170 L540,110 Z"/>
          <path class="continent" id="oc" d="M760,280 L870,270 L900,320 L850,370 L770,360 L750,310 Z"/>
          <text class="continent-label" x="175" y="150">North America</text>
          <text class="continent-label" x="230" y="340">South America</text>
          <text class="continent-label" x="470" y="115">Europe</text>
          <text class="continent-label" x="480" y="260">Africa</text>
          <text class="continent-label" x="680" y="120">Asia</text>
          <text class="continent-label" x="820" y="325">Oceania</text>
        </svg>
      </div>
      <div class="world-legend" id="worldLegend"></div>
    </div>
  </div>
  <div class="panel">
    <div class="metrics-box"><strong>Live Signals</strong><br><span id="metricsText">Loading…</span></div>
    <h2>Legend</h2><div id="legendList"></div>
    <h2 style="margin-top:12px">Event Log</h2><div class="event-log" id="eventLog"></div>
  </div>
</div>
<div class="modal" id="modal"><div class="modal-content"><button class="modal-close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const PLAYERS={google:{id:'google',name:'Google',short:'G',hex:'#4285F4',role:'Hyperscaler – Industry Solutions',momentum:'up'},microsoft:{id:'microsoft',name:'Microsoft',short:'MS',hex:'#F25022',role:'Hyperscaler – Copilot Ecosystem',momentum:'stable'},anthropic:{id:'anthropic',name:'Anthropic',short:'A',hex:'#C15F3C',role:'Foundation Lab – Enterprise LLM',momentum:'up'},openai:{id:'openai',name:'OpenAI',short:'OAI',hex:'#10A37F',role:'Foundation Lab',momentum:'down'},aws:{id:'aws',name:'AWS',short:'AWS',hex:'#FF9900',role:'Hyperscaler – Bedrock',momentum:'stable'},specialist:{id:'specialist',name:'Vertical Specialists',short:'VS',hex:'#A855F7',role:'Harvey, Healthcare AI etc.',momentum:'up'},ibm:{id:'ibm',name:'IBM / Governance',short:'IBM',hex:'#0F62FE',role:'Governance-first',momentum:'stable'}};
let territories=[{id:'legal',name:'Legal',meta:'Contracts • Research • Compliance',status:'hot',influence:{google:28,microsoft:32,specialist:25,anthropic:10,openai:5},note:'Google launched Gemini Enterprise for Legal (Preview). Harvey strong.'},{id:'finance',name:'Financial Services',meta:'Capital Markets • KYC • Risk',status:'hot',influence:{google:30,microsoft:35,anthropic:12,openai:10,aws:8,specialist:5},note:'Google Gemini Enterprise for FS launched same day.'},{id:'healthcare',name:'Healthcare',meta:'EHR • Documentation • Prior Auth',status:'contested',influence:{microsoft:30,specialist:28,google:15,anthropic:12,openai:10,ibm:5},note:'Next on Google roadmap. Strong specialist presence.'},{id:'lifesci',name:'Life Sciences',meta:'GxP • R&D • Regulatory',status:'contested',influence:{google:18,microsoft:25,specialist:22,anthropic:15,ibm:12,openai:8},note:'Explicitly on Google horizon.'},{id:'insurance',name:'Insurance',meta:'Underwriting • Claims • Compliance',status:'normal',influence:{microsoft:35,google:15,anthropic:12,aws:12,openai:10,specialist:16},note:'Microsoft strong via enterprise footprint.'},{id:'gov',name:'Government',meta:'Case Mgmt • Security • Citizens',status:'normal',influence:{microsoft:40,google:18,ibm:15,aws:12,anthropic:10,openai:5},note:'Long cycles, high trust.'},{id:'profsvcs',name:'Professional Services',meta:'Consulting • Audit • Tax',status:'contested',influence:{microsoft:38,google:20,anthropic:15,openai:12,specialist:10,aws:5},note:'Playbook-heavy. Microsoft advantage.'},{id:'retail',name:'Retail',meta:'Customer Data • Supply • Compliance',status:'normal',influence:{google:25,microsoft:30,aws:20,openai:10,anthropic:8,specialist:7},note:'Coming soon on Google roadmap.'}];
let geoDominance={na:{dominant:'microsoft',intensity:.85,note:'Microsoft strongest in NA enterprises. Google rising fast.'},sa:{dominant:'microsoft',intensity:.55,note:'Microsoft leads; lower overall maturity.'},eu:{dominant:'microsoft',intensity:.7,note:'Strong Microsoft. Google gaining. Anthropic in safety deals.'},af:{dominant:'microsoft',intensity:.4,note:'Emerging. Microsoft & Google compete.'},as:{dominant:'google',intensity:.65,note:'Google Cloud strong in APAC.'},oc:{dominant:'microsoft',intensity:.6,note:'Microsoft dominant in AU/NZ.'}};
let events=[{time:'2026-08-25',text:'Google launches Gemini Enterprise for Legal + Financial Services.'},{time:'2026-08-25',text:'Menlo Ventures: Anthropic ~40% enterprise LLM spend, OpenAI ~27%, Google ~21%.'},{time:'2026-Q2',text:'Microsoft strong via M365 Copilot in regulated industries.'}];
const pipeline=['Healthcare (Google)','Life Sciences (Google)','Retail (Google)','More Prof. Services','Insurance depth','Gov vertical agents'];
function enterWarRoom(){document.getElementById('intro').classList.add('hide');try{localStorage.setItem('raw_entered','1')}catch(e){}}
function triggerSurprise(){document.getElementById('modalBody').innerHTML='<div style="text-align:center;padding:10px 0"><div style="color:#ef4444;font-size:.7rem;letter-spacing:.3em;margin-bottom:12px">CLASSIFIED LAYER</div><h3 style="margin-bottom:10px">Doctrine Insight</h3><p style="font-size:.9rem;line-height:1.5;color:var(--muted)">The real war is not model quality.<br>It is who becomes the <strong style="color:var(--text)">governed execution layer</strong> in the verticals where switching costs and trust requirements are highest.</p><p style="margin-top:14px;font-size:.8rem;color:var(--accent)">Legal & Finance were the opening moves.<br>Healthcare and Life Sciences are the next high ground.</p></div>';document.getElementById('modal').classList.add('open')}
function renderPlayers(){document.getElementById('playersList').innerHTML=Object.values(PLAYERS).map(p=>`<div class="player" style="border-left-color:${p.hex}"><div class="token" style="background:${p.hex}">${p.short}</div><div><div class="name">${p.name}</div><div class="role">${p.role}</div></div><div class="momentum ${p.momentum}">${p.momentum==='up'?'↑':p.momentum==='down'?'↓':'→'}</div></div>`).join('')}
function renderLegend(){document.getElementById('legendList').innerHTML=Object.values(PLAYERS).map(p=>`<div class="legend-item"><div class="legend-swatch" style="background:${p.hex}"></div>${p.name}</div>`).join('')}
function renderBoard(){document.getElementById('board').innerHTML=territories.map(t=>{const total=Object.values(t.influence).reduce((a,b)=>a+b,0)||1;const sorted=Object.entries(t.influence).sort((a,b)=>b[1]-a[1]);const bars=sorted.map(([pid,val])=>`<span style="width:${(val/total*100).toFixed(0)}%;background:${PLAYERS[pid].hex}" title="${PLAYERS[pid].name}: ${val}"></span>`).join('');const tokens=sorted.slice(0,5).map(([pid])=>`<div class="token-mini" style="background:${PLAYERS[pid].hex}" title="${PLAYERS[pid].name}">${PLAYERS[pid].short}</div>`).join('');const sc=t.status==='hot'?'hot':t.status==='contested'?'contested':'';return `<div class="territory ${sc}" onclick="showDetail('${t.id}')"><div class="status-badge">${t.status==='hot'?'🔥 HOT':t.status==='contested'?'⚔ Contested':'Stable'}</div><div class="name">${t.name}</div><div class="meta">${t.meta}</div><div class="influence-bar">${bars}</div><div class="tokens">${tokens}</div></div>`}).join('')}
function renderWorld(){Object.entries(geoDominance).forEach(([id,data])=>{const el=document.getElementById(id);if(!el)return;el.style.fill=PLAYERS[data.dominant].hex;el.style.opacity=.42+data.intensity*.5;el.onclick=()=>showGeoDetail(id)});document.getElementById('worldLegend').innerHTML=Object.values(PLAYERS).map(p=>`<span><i style="background:${p.hex}"></i>${p.short}</span>`).join('')}
function renderMetrics(){const hot=territories.filter(t=>t.status==='hot').map(t=>t.name).join(' · ')||'—';const contested=territories.filter(t=>t.status==='contested').map(t=>t.name).join(' · ')||'—';const leaders={};territories.forEach(t=>{const top=Object.entries(t.influence).sort((a,b)=>b[1]-a[1])[0];if(top)leaders[top[0]]=(leaders[top[0]]||0)+1});const top=Object.entries(leaders).sort((a,b)=>b[1]-a[1])[0];document.getElementById('metricsText').innerHTML=`Hot: <strong>${hot}</strong><br>Contested: <strong>${contested}</strong><br>Most territory leads: <strong>${top?PLAYERS[top[0]].name:'—'}</strong>`}
function renderPipeline(){document.getElementById('pipeline').innerHTML=pipeline.map(p=>`<div class="pipeline-item">${p}</div>`).join('')}
function renderEvents(){document.getElementById('eventLog').innerHTML=events.map(e=>`<div class="event"><div class="time">${e.time}</div>${e.text}</div>`).join('')}
function showDetail(id){const t=territories.find(x=>x.id===id);if(!t)return;const total=Object.values(t.influence).reduce((a,b)=>a+b,0)||1;const rows=Object.entries(t.influence).sort((a,b)=>b[1]-a[1]).map(([pid,val])=>{const p=PLAYERS[pid];return `<div style="display:flex;justify-content:space-between;margin:5px 0"><span><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${p.hex};margin-right:7px"></span>${p.name}</span><span>${val} (${(val/total*100).toFixed(1)}%)</span></div>`}).join('');document.getElementById('modalBody').innerHTML=`<h3>${t.name}</h3><p style="color:var(--muted);margin-bottom:10px">${t.meta}</p><p style="margin-bottom:14px;font-size:.9rem">${t.note}</p><h4 style="margin-bottom:6px">Relative Influence</h4>${rows}<p style="margin-top:12px;font-size:.72rem;color:var(--muted)">Relative estimates only.</p>`;document.getElementById('modal').classList.add('open')}
function showGeoDetail(id){const data=geoDominance[id];const names={na:'North America',sa:'South America',eu:'Europe',af:'Africa',as:'Asia',oc:'Oceania'};const p=PLAYERS[data.dominant];document.getElementById('modalBody').innerHTML=`<h3>${names[id]}</h3><p style="margin:10px 0">Dominant: <strong style="color:${p.hex}">${p.name}</strong></p><p style="font-size:.9rem">${data.note}</p><p style="margin-top:10px;font-size:.75rem;color:var(--muted)">Intensity: ${(data.intensity*100).toFixed(0)}%</p>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function switchView(view){const board=document.getElementById('board'),world=document.getElementById('worldView');if(view==='world'){board.classList.add('hidden');world.classList.add('active');document.getElementById('btnBoard').classList.remove('active');document.getElementById('btnWorld').classList.add('active');document.getElementById('viewTitle').textContent='WORLD MAP — Geographic Dominance';renderWorld()}else{board.classList.remove('hidden');world.classList.remove('active');document.getElementById('btnBoard').classList.add('active');document.getElementById('btnWorld').classList.remove('active');document.getElementById('viewTitle').textContent='THE BOARD — Regulated AI Verticals'}}
function simulateUpdate(){territories.forEach(t=>Object.keys(t.influence).forEach(pid=>{t.influence[pid]=Math.max(2,Math.min(50,t.influence[pid]+(Math.random()-.48)*3))}));Object.keys(geoDominance).forEach(k=>{geoDominance[k].intensity=Math.max(.3,Math.min(.95,geoDominance[k].intensity+(Math.random()-.5)*.06))});const msgs=['Influence drift across verticals.','Specialist pressure rises in Healthcare.','Google expands Legal connectors.','Microsoft deepens vertical agents.','Anthropic enterprise win in regulated sector.'];events.unshift({time:new Date().toISOString().slice(0,16).replace('T',' '),text:'Simulated: '+msgs[Math.floor(Math.random()*msgs.length)]});if(events.length>12)events.pop();document.getElementById('lastUpdate').textContent='Snapshot: '+new Date().toISOString().slice(0,16).replace('T',' ')+' (sim)';renderBoard();renderWorld();renderMetrics();renderEvents()}
function resetBoard(){location.reload()}
renderPlayers();renderLegend();renderBoard();renderWorld();renderMetrics();renderPipeline();renderEvents();
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
try{if(localStorage.getItem('raw_entered')==='1')document.getElementById('intro').classList.add('hide')}catch(e){}
</script>
</body>
</html>
