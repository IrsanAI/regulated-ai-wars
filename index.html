<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>regulated-ai-wars – Strategic Conquest Map</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #141a2a;
      --border: #2a3548;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --google: #4285f4;
      --microsoft: #00a4ef;
      --anthropic: #d97706;
      --openai: #10a37f;
      --aws: #ff9900;
      --specialist: #a855f7;
      --ibm: #054ada;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: linear-gradient(90deg, #0f172a, #1e293b);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header h1 span { color: var(--accent); }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button, .view-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    button:hover, .view-btn:hover { background: #1e293b; border-color: var(--accent); }
    button.primary, .view-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .timestamp { font-size: 0.8rem; color: var(--muted); }

    .main {
      display: grid;
      grid-template-columns: 260px 1fr 280px;
      gap: 14px;
      padding: 14px;
      height: calc(100vh - 64px);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow-y: auto;
    }
    .panel h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .player {
      display: flex; align-items: center; gap: 8px;
      padding: 8px; margin-bottom: 6px;
      border-radius: 8px; background: rgba(255,255,255,0.03);
      border-left: 4px solid transparent;
    }
    .player .token {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.7rem; color: white; flex-shrink: 0;
    }
    .player .name { font-weight: 600; font-size: 0.85rem; }
    .player .role { font-size: 0.7rem; color: var(--muted); }
    .momentum { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; background: rgba(16,185,129,0.15); color: #34d399; }
    .momentum.down { background: rgba(239,68,68,0.15); color: #f87171; }
    .momentum.stable { background: rgba(148,163,184,0.15); color: #94a3b8; }

    .board-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .board-title { text-align: center; font-size: 1rem; font-weight: 600; margin-bottom: 10px; color: var(--muted); }

    .board {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      min-height: 0;
    }
    .territory {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex; flex-direction: column;
      position: relative;
      transition: all 0.25s;
      cursor: pointer;
    }
    .territory:hover { border-color: var(--accent); transform: translateY(-2px); }
    .territory.contested { border-color: #f59e0b; }
    .territory.hot { border-color: #ef4444; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }
    .territory .name { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
    .territory .meta { font-size: 0.65rem; color: var(--muted); margin-bottom: 6px; }
    .influence-bar { height: 5px; background: #1e293b; border-radius: 3px; overflow: hidden; margin-bottom: 6px; display: flex; }
    .influence-bar span { height: 100%; }
    .tokens { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; }
    .token-mini {
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 700; color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .status-badge {
      position: absolute; top: 6px; right: 6px;
      font-size: 0.6rem; padding: 2px 5px; border-radius: 4px;
      background: rgba(0,0,0,0.45);
    }

    .world-view { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .world-view.active { display: flex; }
    .board.hidden { display: none; }
    .world-svg-wrap {
      flex: 1;
      position: relative;
      background: radial-gradient(ellipse at center, #0f172a 0%, #020617 100%);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .world-svg-wrap svg { width: 100%; height: 100%; display: block; }
    .continent {
      stroke: #1e293b;
      stroke-width: 1.5;
      transition: all 0.3s;
      cursor: pointer;
    }
    .continent:hover { stroke: #fff; stroke-width: 2; filter: brightness(1.15); }
    .continent-label {
      font-size: 11px;
      font-weight: 600;
      fill: rgba(255,255,255,0.85);
      pointer-events: none;
      text-anchor: middle;
    }
    .world-legend {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      padding: 8px 0 0; font-size: 0.75rem;
    }
    .world-legend span { display: flex; align-items: center; gap: 4px; }
    .world-legend i {
      width: 12px; height: 12px; border-radius: 3px; display: inline-block;
    }

    .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; font-size: 0.8rem; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }
    .event-log { margin-top: 12px; max-height: 240px; overflow-y: auto; }
    .event {
      font-size: 0.75rem; padding: 7px;
      border-left: 3px solid var(--accent);
      background: rgba(59,130,246,0.08);
      margin-bottom: 5px; border-radius: 0 6px 6px 0;
    }
    .event .time { color: var(--muted); font-size: 0.65rem; }
    .pipeline { display: flex; flex-wrap: wrap; gap: 5px; }
    .pipeline-item {
      font-size: 0.7rem; padding: 3px 7px;
      background: rgba(255,255,255,0.05);
      border-radius: 5px; border: 1px solid var(--border);
    }
    .metrics-box {
      background: rgba(59,130,246,0.08);
      border: 1px solid rgba(59,130,246,0.25);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 0.8rem;
    }
    .metrics-box strong { color: var(--accent); }

    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px; max-width: 500px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }

    @media (max-width: 1100px) {
      .main { grid-template-columns: 1fr; height: auto; }
      .board { grid-template-columns: repeat(2, 1fr); min-height: 420px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>regulated-ai-wars <span>— Strategic Conquest Map</span></h1>
    <div class="controls">
      <button class="view-btn active" id="btnBoard" onclick="switchView('board')">Risk Board</button>
      <button class="view-btn" id="btnWorld" onclick="switchView('world')">World Map</button>
      <span class="timestamp" id="lastUpdate">Snapshot: 2026-08-25</span>
      <button onclick="simulateUpdate()">↻ Simulate Update</button>
      <button class="primary" onclick="resetBoard()">Reset</button>
    </div>
  </header>

  <div class="main">
    <div class="panel">
      <h2>Big Players & Contenders</h2>
      <div id="playersList"></div>
      <div style="margin-top:16px">
        <h2>Off-Board / Pipeline</h2>
        <div class="pipeline" id="pipeline"></div>
      </div>
    </div>

    <div class="board-container">
      <div class="board-title" id="viewTitle">THE BOARD — Regulated AI Verticals</div>
      <div class="board" id="board"></div>
      <div class="world-view" id="worldView">
        <div class="world-svg-wrap">
          <svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet" id="worldSvg">
            <path class="continent" id="na" data-name="North America" d="M80,80 L220,60 L280,90 L300,160 L260,220 L180,240 L120,200 L70,150 Z" />
            <path class="continent" id="sa" data-name="South America" d="M200,260 L270,250 L290,320 L260,400 L200,420 L170,360 L180,290 Z" />
            <path class="continent" id="eu" data-name="Europe" d="M420,70 L520,60 L540,100 L510,150 L450,160 L410,120 Z" />
            <path class="continent" id="af" data-name="Africa" d="M430,170 L530,160 L560,240 L540,340 L470,360 L420,300 L410,220 Z" />
            <path class="continent" id="as" data-name="Asia" d="M540,50 L780,40 L850,100 L820,180 L700,200 L580,170 L540,110 Z" />
            <path class="continent" id="oc" data-name="Oceania" d="M760,280 L870,270 L900,320 L850,370 L770,360 L750,310 Z" />
            <text class="continent-label" x="175" y="150">North America</text>
            <text class="continent-label" x="230" y="340">South America</text>
            <text class="continent-label" x="470" y="115">Europe</text>
            <text class="continent-label" x="480" y="260">Africa</text>
            <text class="continent-label" x="680" y="120">Asia</text>
            <text class="continent-label" x="820" y="325">Oceania</text>
          </svg>
        </div>
        <div class="world-legend" id="worldLegend"></div>
      </div>
    </div>

    <div class="panel">
      <div class="metrics-box" id="metricsBox">
        <strong>Live Signals</strong><br>
        <span id="metricsText">Loading…</span>
      </div>
      <h2>Legend</h2>
      <div id="legendList"></div>
      <h2 style="margin-top:14px">Event Log</h2>
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const PLAYERS = {
      google:     { id:'google',     name:'Google',     short:'G',   color:'var(--google)',     role:'Hyperscaler – Industry Solutions', momentum:'up' },
      microsoft:  { id:'microsoft',  name:'Microsoft',  short:'MS',  color:'var(--microsoft)',  role:'Hyperscaler – Copilot Ecosystem', momentum:'stable' },
      anthropic:  { id:'anthropic',  name:'Anthropic',  short:'A',   color:'var(--anthropic)',  role:'Foundation Lab – Enterprise LLM', momentum:'up' },
      openai:     { id:'openai',     name:'OpenAI',     short:'OAI', color:'var(--openai)',     role:'Foundation Lab', momentum:'down' },
      aws:        { id:'aws',        name:'AWS',        short:'AWS', color:'var(--aws)',        role:'Hyperscaler – Bedrock', momentum:'stable' },
      specialist: { id:'specialist', name:'Vertical Specialists', short:'VS', color:'var(--specialist)', role:'Harvey, Healthcare AI etc.', momentum:'up' },
      ibm:        { id:'ibm',        name:'IBM / Governance', short:'IBM', color:'var(--ibm)', role:'Governance-first', momentum:'stable' }
    };

    const HEX = {
      google: '#4285f4', microsoft: '#00a4ef', anthropic: '#d97706',
      openai: '#10a37f', aws: '#ff9900', specialist: '#a855f7', ibm: '#054ada'
    };

    let territories = [
      { id:'legal', name:'Legal', meta:'Contracts • Research • Compliance', status:'hot',
        influence:{ google:28, microsoft:32, specialist:25, anthropic:10, openai:5 },
        note:'Google just launched Gemini Enterprise for Legal (Preview). Harvey strong. Microsoft via Copilot + partners.' },
      { id:'finance', name:'Financial Services', meta:'Capital Markets • KYC • Risk', status:'hot',
        influence:{ google:30, microsoft:35, anthropic:12, openai:10, aws:8, specialist:5 },
        note:'Google Gemini Enterprise for FS launched same day. Microsoft deep via Azure + Copilot.' },
      { id:'healthcare', name:'Healthcare', meta:'EHR • Documentation • Prior Auth', status:'contested',
        influence:{ microsoft:30, specialist:28, google:15, anthropic:12, openai:10, ibm:5 },
        note:'Next on Google roadmap. Strong specialist presence. Microsoft Copilot adoption high.' },
      { id:'lifesci', name:'Life Sciences', meta:'GxP • R&D • Regulatory', status:'contested',
        influence:{ google:18, microsoft:25, specialist:22, anthropic:15, ibm:12, openai:8 },
        note:'Explicitly on Google horizon. High governance needs favor controlled platforms.' },
      { id:'insurance', name:'Insurance', meta:'Underwriting • Claims • Compliance', status:'normal',
        influence:{ microsoft:35, google:15, anthropic:12, aws:12, openai:10, specialist:16 },
        note:'Microsoft strong via existing enterprise footprint.' },
      { id:'gov', name:'Government', meta:'Case Mgmt • Security • Citizens', status:'normal',
        influence:{ microsoft:40, google:18, ibm:15, aws:12, anthropic:10, openai:5 },
        note:'Long cycles, high trust requirements. Microsoft & IBM historically strong.' },
      { id:'profsvcs', name:'Professional Services', meta:'Consulting • Audit • Tax', status:'contested',
        influence:{ microsoft:38, google:20, anthropic:15, openai:12, specialist:10, aws:5 },
        note:'Playbook-heavy. Microsoft Copilot advantage.' },
      { id:'retail', name:'Retail', meta:'Customer Data • Supply • Compliance', status:'normal',
        influence:{ google:25, microsoft:30, aws:20, openai:10, anthropic:8, specialist:7 },
        note:'Listed as coming soon by Google for Gemini Enterprise industry solutions.' }
    ];

    let geoDominance = {
      na: { dominant: 'microsoft', intensity: 0.85, note: 'Microsoft Copilot + Azure strongest in North American enterprises. Google rising fast with Legal/FS launches.' },
      sa: { dominant: 'microsoft', intensity: 0.55, note: 'Microsoft still leads, but lower overall enterprise AI maturity.' },
      eu: { dominant: 'microsoft', intensity: 0.70, note: 'Strong Microsoft footprint. Google gaining with regulated industry focus. Anthropic present in safety-sensitive deals.' },
      af: { dominant: 'microsoft', intensity: 0.40, note: 'Emerging. Microsoft and Google competing for public sector and banking.' },
      as: { dominant: 'google', intensity: 0.65, note: 'Google Cloud strong in APAC. Microsoft and AWS also major. Local specialists growing.' },
      oc: { dominant: 'microsoft', intensity: 0.60, note: 'Microsoft dominant in Australia/NZ enterprise. Google increasing presence.' }
    };

    let events = [
      { time:'2026-08-25', text:'Google launches Gemini Enterprise for Legal + Financial Services (Preview). Roadmap: Healthcare, Life Sciences, Retail.' },
      { time:'2026-08-25', text:'Menlo Ventures (late 2025): Anthropic ~40% enterprise LLM spend, OpenAI ~27%, Google ~21%.' },
      { time:'2026-Q2', text:'Microsoft continues strong horizontal distribution via M365 Copilot in regulated industries.' }
    ];

    const pipeline = ['Healthcare (Google)','Life Sciences (Google)','Retail (Google)','More Prof. Services','Insurance depth','Gov vertical agents'];

    function renderPlayers() {
      document.getElementById('playersList').innerHTML = Object.values(PLAYERS).map(p => `
        <div class="player" style="border-left-color:${p.color}">
          <div class="token" style="background:${p.color}">${p.short}</div>
          <div>
            <div class="name">${p.name}</div>
            <div class="role">${p.role}</div>
          </div>
          <div class="momentum ${p.momentum}">${p.momentum==='up'?'↑':p.momentum==='down'?'↓':'→'}</div>
        </div>`).join('');
    }

    function renderLegend() {
      document.getElementById('legendList').innerHTML = Object.values(PLAYERS).map(p =>
        `<div class="legend-item"><div class="legend-swatch" style="background:${p.color}"></div>${p.name}</div>`
      ).join('');
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = territories.map(t => {
        const total = Object.values(t.influence).reduce((a,b)=>a+b,0)||1;
        const sorted = Object.entries(t.influence).sort((a,b)=>b[1]-a[1]);
        const bars = sorted.map(([pid,val]) => {
          const pct = (val/total*100).toFixed(0);
          return `<span style="width:${pct}%;background:${PLAYERS[pid]?.color||'#666'}" title="${PLAYERS[pid]?.name}: ${val}"></span>`;
        }).join('');
        const tokens = sorted.slice(0,5).map(([pid]) => {
          const p = PLAYERS[pid]; if(!p) return '';
          return `<div class="token-mini" style="background:${p.color}" title="${p.name}">${p.short}</div>`;
        }).join('');
        const statusClass = t.status==='hot'?'hot':t.status==='contested'?'contested':'';
        return `<div class="territory ${statusClass}" onclick="showDetail('${t.id}')">
          <div class="status-badge">${t.status==='hot'?'🔥 HOT':t.status==='contested'?'⚔ Contested':'Stable'}</div>
          <div class="name">${t.name}</div>
          <div class="meta">${t.meta}</div>
          <div class="influence-bar">${bars}</div>
          <div class="tokens">${tokens}</div>
        </div>`;
      }).join('');
    }

    function renderWorld() {
      Object.entries(geoDominance).forEach(([id, data]) => {
        const el = document.getElementById(id);
        if (!el) return;
        const color = HEX[data.dominant] || '#334155';
        el.style.fill = color;
        el.style.opacity = 0.45 + data.intensity * 0.5;
        el.onclick = () => showGeoDetail(id);
      });
      document.getElementById('worldLegend').innerHTML = Object.values(PLAYERS).map(p =>
        `<span><i style="background:${p.color}"></i>${p.short}</span>`
      ).join('');
    }

    function renderMetrics() {
      const hot = territories.filter(t=>t.status==='hot').map(t=>t.name).join(' · ') || '—';
      const contested = territories.filter(t=>t.status==='contested').map(t=>t.name).join(' · ') || '—';
      const leaders = {};
      territories.forEach(t => {
        const top = Object.entries(t.influence).sort((a,b)=>b[1]-a[1])[0];
        if (top) leaders[top[0]] = (leaders[top[0]]||0)+1;
      });
      const topPlayer = Object.entries(leaders).sort((a,b)=>b[1]-a[1])[0];
      const topName = topPlayer ? PLAYERS[topPlayer[0]].name : '—';
      document.getElementById('metricsText').innerHTML = `
        Hot: <strong>${hot}</strong><br>
        Contested: <strong>${contested}</strong><br>
        Most territory leads: <strong>${topName}</strong>
      `;
    }

    function renderPipeline() {
      document.getElementById('pipeline').innerHTML = pipeline.map(p =>
        `<div class="pipeline-item">${p}</div>`).join('');
    }

    function renderEvents() {
      document.getElementById('eventLog').innerHTML = events.map(e =>
        `<div class="event"><div class="time">${e.time}</div>${e.text}</div>`).join('');
    }

    function showDetail(id) {
      const t = territories.find(x=>x.id===id); if(!t) return;
      const total = Object.values(t.influence).reduce((a,b)=>a+b,0)||1;
      const rows = Object.entries(t.influence).sort((a,b)=>b[1]-a[1]).map(([pid,val])=>{
        const p = PLAYERS[pid];
        return `<div style="display:flex;justify-content:space-between;margin:5px 0">
          <span><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${p.color};margin-right:7px"></span>${p.name}</span>
          <span>${val} (${(val/total*100).toFixed(1)}%)</span></div>`;
      }).join('');
      document.getElementById('modalBody').innerHTML = `
        <h3>${t.name}</h3>
        <p style="color:var(--muted);margin-bottom:10px">${t.meta}</p>
        <p style="margin-bottom:14px;font-size:0.9rem">${t.note}</p>
        <h4 style="margin-bottom:6px">Relative Influence</h4>${rows}
        <p style="margin-top:14px;font-size:0.72rem;color:var(--muted)">Relative estimates for visualization only.</p>`;
      document.getElementById('modal').classList.add('open');
    }

    function showGeoDetail(id) {
      const data = geoDominance[id];
      const names = { na:'North America', sa:'South America', eu:'Europe', af:'Africa', as:'Asia', oc:'Oceania' };
      const p = PLAYERS[data.dominant];
      document.getElementById('modalBody').innerHTML = `
        <h3>${names[id] || id}</h3>
        <p style="margin:10px 0">Current dominant player: <strong style="color:${p.color}">${p.name}</strong></p>
        <p style="font-size:0.9rem;margin-bottom:10px">${data.note}</p>
        <p style="font-size:0.75rem;color:var(--muted)">Intensity: ${(data.intensity*100).toFixed(0)}% — relative presence strength in regulated enterprise AI.</p>`;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    function switchView(view) {
      const board = document.getElementById('board');
      const world = document.getElementById('worldView');
      const btnB = document.getElementById('btnBoard');
      const btnW = document.getElementById('btnWorld');
      if (view === 'world') {
        board.classList.add('hidden');
        world.classList.add('active');
        btnB.classList.remove('active');
        btnW.classList.add('active');
        document.getElementById('viewTitle').textContent = 'WORLD MAP — Geographic Dominance';
        renderWorld();
      } else {
        board.classList.remove('hidden');
        world.classList.remove('active');
        btnB.classList.add('active');
        btnW.classList.remove('active');
        document.getElementById('viewTitle').textContent = 'THE BOARD — Regulated AI Verticals';
      }
    }

    function simulateUpdate() {
      territories.forEach(t => {
        Object.keys(t.influence).forEach(pid => {
          t.influence[pid] = Math.max(2, Math.min(50, t.influence[pid] + (Math.random()-0.48)*3));
        });
      });
      Object.keys(geoDominance).forEach(k => {
        geoDominance[k].intensity = Math.max(0.3, Math.min(0.95, geoDominance[k].intensity + (Math.random()-0.5)*0.06));
      });
      const msgs = [
        'Simulated: Influence drift across verticals.',
        'Simulated: Specialist pressure rises in Healthcare.',
        'Simulated: Google expands connector footprint in Legal.',
        'Simulated: Microsoft deepens vertical agents.',
        'Simulated: Anthropic enterprise win in regulated sector.'
      ];
      events.unshift({ time: new Date().toISOString().slice(0,16).replace('T',' '), text: msgs[Math.floor(Math.random()*msgs.length)] });
      if (events.length > 12) events.pop();
      document.getElementById('lastUpdate').textContent = 'Snapshot: ' + new Date().toISOString().slice(0,16).replace('T',' ') + ' (simulated)';
      renderBoard(); renderWorld(); renderMetrics(); renderEvents();
    }

    function resetBoard() { location.reload(); }

    renderPlayers();
    renderLegend();
    renderBoard();
    renderWorld();
    renderMetrics();
    renderPipeline();
    renderEvents();

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });
  </script>
</body>
</html>
